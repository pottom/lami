[package]
name = "lami"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Layered, declarative system configuration for Arch Linux"
license = "MIT"
repository = "https://github.com/pottom/lami"
categories = ["command-line-utilities"]
keywords = ["arch", "linux", "configuration", "dotfiles", "pacman"]

[dependencies]
# The KDL parser. EXACT pin on purpose: comment-preserving round-trip is what
# `capture` is built on, and the crate is thin (one maintainer, no alternative
# implementation). Only bump this alongside a review of the round-trip tests.
kdl = "=6.7.1"

# Diagnostics with source quoting. The kdl crate already implements the trait.
miette = { version = "7", features = ["fancy"] }
thiserror = "2"

libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = true
strip = true
